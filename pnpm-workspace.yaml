# Hold new resolutions for three days; urgent patch exceptions must be reviewed.
minimumReleaseAge: 4320

allowBuilds:
  '@google/genai': true
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  workerd: true

patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch
  next-themes@0.4.6: patches/next-themes@0.4.6.patch

# Reviewed security patches within the existing parent integrations. Remove an
# override when upstream resolves a patched version itself (see security ledger).
overrides:
  undici@7.29.0: 7.29.1
  dompurify@<3.4.16: 3.4.16
  fast-uri@3.1.7: 3.1.8
  sass@1.77.4: 1.105.1
  '@esbuild-kit/core-utils>esbuild': 0.25.12
  brace-expansion@1.1.18: 1.1.21
  brace-expansion@5.0.9: 5.0.12
  source-map-js@1.2.1: 1.2.2
